version: "3.8"

services:
  proxysql:
    image: proxysql/proxysql:2.5.0
    restart: unless-stopped
    environment:
      CLUSTER_NAME: "orchestrator_proxysql"
    ports:
      - "6033:6033"  # MySQL 客户端连接端口
      - "6032:6032"  # Admin 接口端口
    volumes:
      # 挂载 ProxySQL 数据目录（持久化配置）
      - proxysql-data:/var/lib/proxysql
      # 挂载配置文件
      - ./proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
    command:
      - /usr/bin/proxysql
      - -c
      - /etc/proxysql.cnf
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "6032", "-u", "admin", "-padmin", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mysql-replication
    depends_on:
      - mysql-master
      - mysql-slave-1
      - mysql-slave-2

  # MySQL Master (用于本地测试)
  mysql-master:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--log-slave-updates=ON"
      - "--skip-name-resolve"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mysql-replication

  # MySQL Slave 1
  mysql-slave-1:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave1-data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--server-id=2"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--log-slave-updates=ON"
      - "--skip-name-resolve"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mysql-replication
    depends_on:
      mysql-master:
        condition: service_healthy

  # MySQL Slave 2
  mysql-slave-2:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3308:3306"
    volumes:
      - mysql-slave2-data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--server-id=3"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--log-slave-updates=ON"
      - "--skip-name-resolve"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mysql-replication
    depends_on:
      mysql-master:
        condition: service_healthy

volumes:
  proxysql-data:
  mysql-master-data:
  mysql-slave1-data:
  mysql-slave2-data:

networks:
  mysql-replication:
    driver: bridge

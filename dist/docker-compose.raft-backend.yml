version: "3.8"

services:
  mysql-backend:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: orch_root_pass
      MYSQL_DATABASE: orchestrator
    ports:
      - "3306:3306"
    volumes:
      - mysql-backend-data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--skip-name-resolve"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-backend-data:

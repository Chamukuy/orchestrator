version: "3.8"

services:
  # 主节点 (Master)
  mysql-master:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--log-slave-updates=ON"
      - "--skip-name-resolve"
    networks:
      - mysql-replication
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 从节点 1 (Slave 1)
  mysql-slave-1:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave1-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--server-id=2"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--log-slave-updates=ON"
      - "--skip-name-resolve"
      - "--relay-log=mysql-relay-bin"
      - "--relay-log-index=mysql-relay-bin.index"
    networks:
      - mysql-replication
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 从节点 2 (Slave 2)
  mysql-slave-2:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-slave2-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--server-id=3"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
      - "--log-slave-updates=ON"
      - "--skip-name-resolve"
      - "--relay-log=mysql-relay-bin"
      - "--relay-log-index=mysql-relay-bin.index"
    networks:
      - mysql-replication
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Orchestrator 服务
  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave-1:
        condition: service_healthy
      mysql-slave-2:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - orchestrator-data:/usr/local/orchestrator
      - ./conf/orchestrator-master-slave.conf.json:/etc/orchestrator.conf.json:ro
    environment:
      ORC_TOPOLOGY_USER: orc_client_user
      ORC_TOPOLOGY_PASSWORD: orc_client_password
      ORC_ORCHESTRATOR_USER: orc_server_user
      ORC_ORCHESTRATOR_PASSWORD: orc_server_password
    networks:
      - mysql-replication
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-master-data:
  mysql-slave1-data:
  mysql-slave2-data:
  orchestrator-data:

networks:
  mysql-replication:
    driver: bridge
